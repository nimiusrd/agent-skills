name: Validate agent skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test test-generator helpers
        run: python3 -B -m unittest discover -s skills/test-generator/tests -v

      - name: Check GitHub CLI skill support
        run: |
          gh --version
          gh skill --help >/dev/null

      - name: Validate skills
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run
